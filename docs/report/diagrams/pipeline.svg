le" font-size="12" font-weight="700" fill="#0b4f4a">2. Scheduler (every 30 s)</text><text x="190" y="105" text-anchor="middle" font-size="9.5" fill="#0b4f4a" opacity=".85">start − MEETING_JOIN_OFFSET_MINUTES</text><rect x="20" y="132" width="340" height="46" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.4"/><text x="190" y="153" text-anchor="middle" font-size="12" font-weight="700" fill="#0b4f4a">3. Playwright joins</text><text x="190" y="167" text-anchor="middle" font-size="9.5" fill="#0b4f4a" opacity=".85">persistent profile · Chrome → Edge → Chromium · mic/cam off</text><rect x="20" y="194" width="340" height="46" rx="8" fill="#ecfdf5" stroke="#15803d" stroke-width="1.4"/><text x="190" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">4. FFmpeg records</text><text x="190" y="229" text-anchor="middle" font-size="9.5" fill="#14532d" opacity=".85">gdigrab desktop + dshow audio → recordings/&lt;id&gt;/meeting.mp4</text><rect x="20" y="256" width="340" height="46" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.4"/><text x="190" y="277" text-anchor="middle" font-size="12" font-weight="700" fill="#0b4f4a">5. Meeting ends / Stop</text><text x="190" y="291" text-anchor="middle" font-size="9.5" fill="#0b4f4a" opacity=".85">Leave call detected or Stop &amp; save</text><rect x="20" y="318" width="340" height="46" rx="8" fill="#ecfdf5" stroke="#15803d" stroke-width="1.4"/><text x="190" y="339" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">6. Audio extraction</text><text x="190" y="353" text-anchor="middle" font-size="9.5" fill="#14532d" opacity=".85">FFmpeg → 16 kHz mono WAV</text><rect x="400" y="8" width="340" height="46" rx="8" fill="#ecfdf5" stroke="#15803d" stroke-width="1.4"/><text x="570" y="29" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">7. faster-whisper</text><text x="570" y="43" text-anchor="middle" font-size="9.5" fill="#14532d" opacity=".85">transcripts/&lt;id&gt;/transcript.txt</text><rect x="400" y="70" width="340" height="46" rx="8" fill="#ecfdf5" stroke="#15803d" stroke-width="1.4"/><text x="570" y="91" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">8. AI analysis</text><text x="570" y="105" text-anchor="middle" font-size="9.5" fill="#14532d" opacity=".85">AIServiceManager · map-reduce for long meetings · Joi-validated</text><rect x="400" y="132" width="340" height="46" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="570" y="153" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">9. Tasks + notes</text><text x="570" y="167" text-anchor="middle" font-size="9.5" fill="#1e3a8a" opacity=".85">Task docs · meeting-notes/&lt;id&gt;/summary.md · MongoDB</text><rect x="400" y="194" width="340" height="46" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="570" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">10. RAG ingestion</text><text x="570" y="229" text-anchor="middle" font-size="9.5" fill="#1e3a8a" opacity=".85">chunks → embeddinggemma → ChromaDB / MongoDB</text><rect x="400" y="256" width="340" height="46" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><text x="570" y="277" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">11. Notion · Email</text><text x="570" y="291" text-anchor="middle" font-size="9.5" fill="#7c2d12" opacity=".85">optional, SKIPPED when not configured</text><rect x="400" y="318" width="340" height="46" rx="8" fill="#0f766e" stroke="#0f766e" stroke-width="1.4"/><text x="570" y="339" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">12. Dashboard</text><text x="570" y="353" text-anchor="middle" font-size="9.5" fill="#ffffff" opacity=".85">stage states + activity timeline</text></svg>